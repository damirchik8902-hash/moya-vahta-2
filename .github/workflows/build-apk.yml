name: Build My Vakhta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'vakhta_android_project_source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          unzip -o vakhta_android_project_source.zip -d project

      - name: Build APK
        run: |
          cd project/vakhta_android_project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moya-vahta-apk
          path: project/vakhta_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
